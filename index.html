<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexy Live — Nexora Systems</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --naranja: #FF6B00;
      --blanco: #FFFFFF;
      --gris: #888888;
    }

    html, body {
      min-height: 100vh;
      background: #0a0a0a;
      color: var(--blanco);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gris);
      margin-bottom: 32px;
    }
    .logo span { color: var(--naranja); }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 20px;
      width: 100%;
    }

    .orb-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb-glow {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,107,0,0.35) 0%, rgba(255,107,0,0.08) 45%, transparent 70%);
      filter: blur(10px);
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.15s ease-out;
    }

    #orbSvg {
      width: 200px;
      height: 200px;
      position: relative;
      z-index: 2;
      transition: transform 0.08s ease-out;
    }

    .status {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gris);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gris);
      transition: background 0.3s;
    }

    .status.active .status-dot { background: var(--naranja); animation: blink 1s infinite; }
    .status.active { color: var(--blanco); }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 14px 44px;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      outline: none;
    }

    .btn-start {
      background: var(--naranja);
      color: var(--blanco);
      box-shadow: 0 0 24px rgba(255, 107, 0, 0.3);
    }

    .btn-start:hover {
      background: #FF8C00;
      box-shadow: 0 0 36px rgba(255, 107, 0, 0.5);
      transform: translateY(-1px);
    }

    .btn-stop {
      background: transparent;
      color: var(--gris);
      border: 1px solid rgba(255,255,255,0.1);
      display: none;
    }

    .btn-stop:hover {
      border-color: rgba(255,255,255,0.25);
      color: var(--blanco);
    }

    .hint {
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.05em;
    }

    @media (max-width: 480px) {
      .orb-wrapper { width: 190px; height: 190px; }
      .orb-glow { width: 190px; height: 190px; }
      #orbSvg { width: 160px; height: 160px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #orbSvg, .orb-glow { animation: none; transition: none; }
    }

    #vapi-support-btn,
    [id^="vapi-"],
    [class^="vapi-"] {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="main">
    <div class="logo">NEXORA <span>SYSTEMS</span></div>

    <div class="orb-wrapper">
      <div class="orb-glow" id="orbGlow"></div>
      <svg id="orbSvg" viewBox="0 0 200 200">
        <defs>
          <radialGradient id="orbGradient" cx="38%" cy="32%" r="70%">
            <stop offset="0%" stop-color="#FFB066" />
            <stop offset="30%" stop-color="#FF6B00" />
            <stop offset="65%" stop-color="#B43C00" />
            <stop offset="100%" stop-color="#1E0A00" />
          </radialGradient>
          <filter id="liquid" x="-50%" y="-50%" width="200%" height="200%">
            <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="noise" />
            <feDisplacementMap id="dispMap" in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>
        <circle id="orbCircle" cx="100" cy="100" r="72" fill="url(#orbGradient)" filter="url(#liquid)" />
      </svg>
    </div>

    <div class="status" id="status">
      <div class="status-dot"></div>
      <span id="statusText">Listo para hablar</span>
    </div>

    <div class="btn-wrapper">
      <button class="btn btn-start" id="btnStart">Iniciar conversación</button>
      <button class="btn btn-stop" id="btnStop">Finalizar llamada</button>
      <span class="hint">Necesitas micrófono · Chrome o Safari</span>
    </div>
  </div>

  <script>
    const PUBLIC_KEY = '1fb6beeb-c606-4390-8f75-7894249bac0b';
    const ASSISTANT_ID = 'a9735b99-0fe6-446c-86f1-7e50d6ce53b2';

    (function (d, t) {
      var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
      g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
      g.defer = true;
      g.async = true;
      s.parentNode.insertBefore(g, s);
      g.onload = initVapi;
    })(document, 'script');

    function initVapi() {
      const vapi = window.vapiSDK.run({
        apiKey: PUBLIC_KEY,
        assistant: ASSISTANT_ID,
        config: {}
      });

      const orbSvg = document.getElementById('orbSvg');
      const orbGlow = document.getElementById('orbGlow');
      const turb = document.getElementById('turb');
      const dispMap = document.getElementById('dispMap');
      const statusEl = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      const btnStart = document.getElementById('btnStart');
      const btnStop = document.getElementById('btnStop');

      let audioCtx, analyser, source, animFrame;
      let idleFrame;
      let currentLevel = 0;   // nivel de audio suavizado (0-1)
      let t = 0;              // reloj interno para la animación idle

      // --- Animación "idle": el orbe respira suavemente incluso sin audio ---
      function idleLoop() {
        idleFrame = requestAnimationFrame(idleLoop);
        t += 0.015;

        // ruido base que ondula solo, más fuerte si hay nivel de audio
        const baseFreq = 0.01 + Math.sin(t * 0.6) * 0.003;
        const freq2 = 0.014 + Math.cos(t * 0.4) * 0.004;
        turb.setAttribute('baseFrequency', `${baseFreq.toFixed(4)} ${freq2.toFixed(4)}`);

        const idleScale = 5 + Math.sin(t) * 2;
        const reactiveScale = currentLevel * 26;
        dispMap.setAttribute('scale', (idleScale + reactiveScale).toFixed(1));

        const breathe = 1 + Math.sin(t * 0.8) * 0.02 + currentLevel * 0.18;
        orbSvg.style.transform = `scale(${breathe})`;

        const glowOpacity = 0.5 + currentLevel * 0.5;
        const glowScale = 1 + currentLevel * 0.25;
        orbGlow.style.opacity = glowOpacity;
        orbGlow.style.transform = `scale(${glowScale})`;

        // suaviza el nivel hacia 0 cuando no hay audio nuevo
        currentLevel += (0 - currentLevel) * 0.08;
      }
      idleLoop();

      function setStatus(text, active = false) {
        statusText.textContent = text;
        statusEl.classList.toggle('active', active);
      }

      // --- Audio del propio usuario (micrófono) ---
      function startVisualizer(stream) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function loop() {
          animFrame = requestAnimationFrame(loop);
          analyser.getByteFrequencyData(dataArray);
          const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
          const level = Math.min(1, (avg / 255) * 1.8);
          currentLevel = Math.max(currentLevel, level);
        }
        loop();
      }

      function stopVisualizer() {
        cancelAnimationFrame(animFrame);
        if (source) source.disconnect();
        if (audioCtx) audioCtx.close();
      }

      // --- Volumen de la voz del asistente (Nexy hablando) ---
      vapi.on('volume-level', (volume) => {
        currentLevel = Math.max(currentLevel, volume);
      });

      vapi.on('call-start', () => {
        btnStart.style.display = 'none';
        btnStop.style.display = 'inline-flex';
        setStatus('Conectando...', true);
      });

      vapi.on('speech-start', () => {
        setStatus('🔊 Hablando...', true);
      });

      vapi.on('speech-end', () => {
        setStatus('🎤 Escuchando...', true);
      });

      vapi.on('call-end', () => {
        btnStart.style.display = 'inline-flex';
        btnStop.style.display = 'none';
        setStatus('Listo para hablar', false);
        stopVisualizer();
      });

      vapi.on('error', (e) => {
        console.error('Vapi error:', e);
        setStatus('Error de conexión', false);
      });

      btnStart.addEventListener('click', async () => {
        setStatus('Iniciando...', true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          startVisualizer(stream);
          await vapi.start(ASSISTANT_ID);
        } catch (err) {
          console.error(err);
          setStatus('Necesitas dar permiso al micrófono', false);
          stopVisualizer();
        }
      });

      btnStop.addEventListener('click', () => {
        vapi.stop();
      });
    }
  </script>

</body>
</html>
