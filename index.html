<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexy Live — Nexora Systems</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --naranja: #FF6B00;
      --blanco: #FFFFFF;
      --gris: #888888;
    }

    html, body {
      min-height: 100vh;
      background: #0a0a0a;
      color: var(--blanco);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gris);
      margin-bottom: 32px;
    }
    .logo span { color: var(--naranja); }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 20px;
      width: 100%;
    }

    .orb-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb-outer-glow {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,107,0,0.4) 0%, rgba(255,107,0,0.1) 45%, transparent 70%);
      filter: blur(12px);
      pointer-events: none;
      transition: opacity 0.15s ease-out;
    }

    .orb-clip {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      overflow: hidden;
      z-index: 2;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        inset 0 0 30px rgba(0,0,0,0.4);
    }

    .orb-spin {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 320px;
      height: 320px;
      margin: -160px 0 0 -160px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #1a0800 0deg,
        #FF6B00 45deg,
        #FFD9A8 90deg,
        #FF8C00 135deg,
        #120400 180deg,
        #B43C00 225deg,
        #FFFFFF 270deg,
        #FF6B00 315deg,
        #1a0800 360deg
      );
      filter: blur(18px);
    }

    .orb-sheen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%,
        rgba(255,255,255,0.55) 0%,
        rgba(255,255,255,0.08) 25%,
        transparent 55%
      );
      z-index: 3;
      pointer-events: none;
    }

    .status {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gris);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gris);
      transition: background 0.3s;
    }

    .status.active .status-dot { background: var(--naranja); animation: blink 1s infinite; }
    .status.active { color: var(--blanco); }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 14px 44px;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      outline: none;
    }

    .btn-start {
      background: var(--naranja);
      color: var(--blanco);
      box-shadow: 0 0 24px rgba(255, 107, 0, 0.3);
    }

    .btn-start:hover {
      background: #FF8C00;
      box-shadow: 0 0 36px rgba(255, 107, 0, 0.5);
      transform: translateY(-1px);
    }

    .btn-stop {
      background: transparent;
      color: var(--gris);
      border: 1px solid rgba(255,255,255,0.1);
      display: none;
    }

    .btn-stop:hover {
      border-color: rgba(255,255,255,0.25);
      color: var(--blanco);
    }

    .hint {
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.05em;
    }

    @media (max-width: 480px) {
      .orb-wrapper { width: 180px; height: 180px; }
      .orb-outer-glow { width: 180px; height: 180px; }
      .orb-clip { width: 150px; height: 150px; }
      .orb-spin { width: 270px; height: 270px; margin: -135px 0 0 -135px; }
    }

    #vapi-support-btn,
    [id^="vapi-"],
    [class^="vapi-"] {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="main">
    <div class="logo">NEXORA <span>SYSTEMS</span></div>

    <div class="orb-wrapper">
      <div class="orb-outer-glow" id="orbGlow"></div>
      <div class="orb-clip" id="orbClip">
        <div class="orb-spin" id="orbSpin"></div>
        <div class="orb-sheen"></div>
      </div>
    </div>

    <div class="status" id="status">
      <div class="status-dot"></div>
      <span id="statusText">Listo para hablar</span>
    </div>

    <div class="btn-wrapper">
      <button class="btn btn-start" id="btnStart">Iniciar conversación</button>
      <button class="btn btn-stop" id="btnStop">Finalizar llamada</button>
      <span class="hint">Necesitas micrófono · Chrome o Safari</span>
    </div>
  </div>

  <script>
    const PUBLIC_KEY = '1fb6beeb-c606-4390-8f75-7894249bac0b';
    const ASSISTANT_ID = 'a9735b99-0fe6-446c-86f1-7e50d6ce53b2';

    (function (d, t) {
      var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
      g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
      g.defer = true;
      g.async = true;
      s.parentNode.insertBefore(g, s);
      g.onload = initVapi;
    })(document, 'script');

    function initVapi() {
      const vapi = window.vapiSDK.run({
        apiKey: PUBLIC_KEY,
        assistant: ASSISTANT_ID,
        config: {}
      });

      const orbClip = document.getElementById('orbClip');
      const orbSpin = document.getElementById('orbSpin');
      const orbGlow = document.getElementById('orbGlow');
      const statusEl = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      const btnStart = document.getElementById('btnStart');
      const btnStop = document.getElementById('btnStop');

      let audioCtx, analyser, source, animFrame;
      let idleFrame;
      let currentLevel = 0;
      let t = 0;

      function idleLoop() {
        idleFrame = requestAnimationFrame(idleLoop);
        t += 0.05;

        const jitterX = (Math.sin(t * 9) * 0.6 + Math.sin(t * 21) * 0.4) * currentLevel * 5;
        const jitterY = (Math.cos(t * 13) * 0.6 + Math.sin(t * 27) * 0.4) * currentLevel * 5;
        const jitterRot = (Math.sin(t * 11) * 0.5 + Math.sin(t * 19) * 0.5) * currentLevel * 4;

        const breathe = 1 + Math.sin(t * 0.4) * 0.01 + currentLevel * 0.1;

        orbSpin.style.transform =
          `translate(${jitterX}px, ${jitterY}px) rotate(${jitterRot}deg) scale(${breathe})`;

        const blurAmount = 18 - currentLevel * 6;
        orbSpin.style.filter = `blur(${Math.max(10, blurAmount)}px)`;

        const glowOpacity = 0.55 + currentLevel * 0.45;
        const glowScale = 1 + currentLevel * 0.25;
        orbGlow.style.opacity = glowOpacity;
        orbGlow.style.transform = `scale(${glowScale})`;

        currentLevel += (0 - currentLevel) * 0.1;
      }
      idleLoop();

      function setStatus(text, active = false) {
        statusText.textContent = text;
        statusEl.classList.toggle('active', active);
      }

      function startVisualizer(stream) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function loop() {
          animFrame = requestAnimationFrame(loop);
          analyser.getByteFrequencyData(dataArray);
          const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
          const level = Math.min(1, (avg / 255) * 1.8);
          currentLevel = Math.max(currentLevel, level);
        }
        loop();
      }

      function stopVisualizer() {
        cancelAnimationFrame(animFrame);
        if (source) source.disconnect();
        if (audioCtx) audioCtx.close();
      }

      vapi.on('volume-level', (volume) => {
        currentLevel = Math.max(currentLevel, volume);
      });

      vapi.on('call-start', () => {
        btnStart.style.display = 'none';
        btnStop.style.display = 'inline-flex';
        setStatus('Conectando...', true);
      });

      vapi.on('speech-start', () => {
        setStatus('🔊 Hablando...', true);
      });

      vapi.on('speech-end', () => {
        setStatus('🎤 Escuchando...', true);
      });

      vapi.on('call-end', () => {
        btnStart.style.display = 'inline-flex';
        btnStop.style.display = 'none';
        setStatus('Listo para hablar', false);
        stopVisualizer();
      });

      vapi.on('error', (e) => {
        console.error('Vapi error:', e);
        setStatus('Error de conexión', false);
      });

      btnStart.addEventListener('click', async () => {
        setStatus('Iniciando...', true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          startVisualizer(stream);
          await vapi.start(ASSISTANT_ID);
        } catch (err) {
          console.error(err);
          setStatus('Necesitas dar permiso al micrófono', false);
          stopVisualizer();
        }
      });

      btnStop.addEventListener('click', () => {
        vapi.stop();
      });
    }
  </script>

</body>
</html>
