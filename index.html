<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexy Live — Nexora Systems</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --naranja: #FF6B00;
      --blanco: #FFFFFF;
      --gris: #888888;
    }

    html, body {
      min-height: 100vh;
      background: #0a0a0a;
      color: var(--blanco);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gris);
      margin-bottom: 32px;
    }
    .logo span { color: var(--naranja); }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 20px;
      width: 100%;
    }

    .orb-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb-outer-glow {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,107,0,0.4) 0%, rgba(255,107,0,0.1) 45%, transparent 70%);
      filter: blur(12px);
      pointer-events: none;
      transition: opacity 0.15s ease-out;
    }

    .orb-clip {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      overflow: hidden;
      z-index: 2;
      background: #050505;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        inset 0 0 30px rgba(0,0,0,0.5);
    }

    /* Manchas de color tipo "blob" que se mezclan (efecto Siri) */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(22px);
      mix-blend-mode: screen;
      will-change: transform;
    }
    .blob-1 { width: 130px; height: 130px; background: radial-gradient(circle, #FF6B00 0%, transparent 70%); }
    .blob-2 { width: 120px; height: 120px; background: radial-gradient(circle, #FFFFFF 0%, transparent 70%); opacity: 0.7; }
    .blob-3 { width: 110px; height: 110px; background: radial-gradient(circle, #FF8C00 0%, transparent 70%); }
    .blob-4 { width: 100px; height: 100px; background: radial-gradient(circle, #B43C00 0%, transparent 70%); }
    .blob-5 { width: 90px; height: 90px; background: radial-gradient(circle, #FFD9A8 0%, transparent 70%); opacity: 0.8; }

    .orb-base {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0d0d0d;
      z-index: 0;
    }

    .orb-sheen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%,
        rgba(255,255,255,0.35) 0%,
        rgba(255,255,255,0.05) 25%,
        transparent 55%
      );
      z-index: 5;
      pointer-events: none;
    }

    .status {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gris);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gris);
      transition: background 0.3s;
    }

    .status.active .status-dot { background: var(--naranja); animation: blink 1s infinite; }
    .status.active { color: var(--blanco); }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 14px 44px;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      outline: none;
    }

    .btn-start {
      background: var(--naranja);
      color: var(--blanco);
      box-shadow: 0 0 24px rgba(255, 107, 0, 0.3);
    }

    .btn-start:hover {
      background: #FF8C00;
      box-shadow: 0 0 36px rgba(255, 107, 0, 0.5);
      transform: translateY(-1px);
    }

    .btn-stop {
      background: transparent;
      color: var(--gris);
      border: 1px solid rgba(255,255,255,0.1);
      display: none;
    }

    .btn-stop:hover {
      border-color: rgba(255,255,255,0.25);
      color: var(--blanco);
    }

    .hint {
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.05em;
    }

    @media (max-width: 480px) {
      .orb-wrapper { width: 180px; height: 180px; }
      .orb-outer-glow { width: 180px; height: 180px; }
      .orb-clip { width: 150px; height: 150px; }
    }

    #vapi-support-btn,
    [id^="vapi-"],
    [class^="vapi-"] {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="main">
    <div class="logo">NEXORA <span>SYSTEMS</span></div>

    <div class="orb-wrapper">
      <div class="orb-outer-glow" id="orbGlow"></div>
      <div class="orb-clip" id="orbClip">
        <div class="orb-base"></div>
        <div class="blob blob-1" id="blob1"></div>
        <div class="blob blob-2" id="blob2"></div>
        <div class="blob blob-3" id="blob3"></div>
        <div class="blob blob-4" id="blob4"></div>
        <div class="blob blob-5" id="blob5"></div>
        <div class="orb-sheen"></div>
      </div>
    </div>

    <div class="status" id="status">
      <div class="status-dot"></div>
      <span id="statusText">Listo para hablar</span>
    </div>

    <div class="btn-wrapper">
      <button class="btn btn-start" id="btnStart">Iniciar conversación</button>
      <button class="btn btn-stop" id="btnStop">Finalizar llamada</button>
      <span class="hint">Necesitas micrófono · Chrome o Safari</span>
    </div>
  </div>

  <script>
    const PUBLIC_KEY = '1fb6beeb-c606-4390-8f75-7894249bac0b';
    const ASSISTANT_ID = 'a9735b99-0fe6-446c-86f1-7e50d6ce53b2';

    (function (d, t) {
      var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
      g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
      g.defer = true;
      g.async = true;
      s.parentNode.insertBefore(g, s);
      g.onload = initVapi;
    })(document, 'script');

    function initVapi() {
      const vapi = window.vapiSDK.run({
        apiKey: PUBLIC_KEY,
        assistant: ASSISTANT_ID,
        config: {}
      });

      const orbGlow = document.getElementById('orbGlow');
      const statusEl = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      const btnStart = document.getElementById('btnStart');
      const btnStop = document.getElementById('btnStop');

      const blobs = [
        { el: document.getElementById('blob1'), rx: 28, ry: 22, sx: 0.7,  sy: 0.9,  phase: 0 },
        { el: document.getElementById('blob2'), rx: 24, ry: 30, sx: 0.55, sy: 0.65, phase: 1.3 },
        { el: document.getElementById('blob3'), rx: 32, ry: 18, sx: 0.9,  sy: 0.5,  phase: 2.6 },
        { el: document.getElementById('blob4'), rx: 20, ry: 26, sx: 0.4,  sy: 0.75, phase: 4.0 },
        { el: document.getElementById('blob5'), rx: 26, ry: 20, sx: 0.8,  sy: 0.6,  phase: 5.2 }
      ];

      let audioCtx, analyser, source, animFrame;
      let idleFrame;
      let currentLevel = 0;
      let t = 0;

      // --- Movimiento tipo "Siri": manchas de color flotando y mezclándose ---
      function idleLoop() {
        idleFrame = requestAnimationFrame(idleLoop);

        // Velocidad base lenta en reposo, más rápida al hablar
        const speed = 0.012 + currentLevel * 0.05;
        t += speed;

        const reactiveBoost = 1 + currentLevel * 0.9;

        blobs.forEach((b) => {
          const x = Math.sin(t * b.sx + b.phase) * b.rx * reactiveBoost;
          const y = Math.cos(t * b.sy + b.phase * 1.3) * b.ry * reactiveBoost;
          const scale = 1 + Math.sin(t * 0.6 + b.phase) * 0.08 + currentLevel * 0.25;
          b.el.style.transform =
            `translate(-50%, -50%) translate(${x}px, ${y}px) scale(${scale})`;
        });

        const glowOpacity = 0.5 + currentLevel * 0.5;
        const glowScale = 1 + currentLevel * 0.28;
        orbGlow.style.opacity = glowOpacity;
        orbGlow.style.transform = `scale(${glowScale})`;

        currentLevel += (0 - currentLevel) * 0.1;
      }

      // Posiciona los blobs centrados antes de animar
      blobs.forEach((b) => {
        b.el.style.top = '50%';
        b.el.style.left = '50%';
        b.el.style.transform = 'translate(-50%, -50%)';
      });
      idleLoop();

      function setStatus(text, active = false) {
        statusText.textContent = text;
        statusEl.classList.toggle('active', active);
      }

      function startVisualizer(stream) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function loop() {
          animFrame = requestAnimationFrame(loop);
          analyser.getByteFrequencyData(dataArray);
          const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
          const level = Math.min(1, (avg / 255) * 1.8);
          currentLevel = Math.max(currentLevel, level);
        }
        loop();
      }

      function stopVisualizer() {
        cancelAnimationFrame(animFrame);
        if (source) source.disconnect();
        if (audioCtx) audioCtx.close();
      }

      vapi.on('volume-level', (volume) => {
        currentLevel = Math.max(currentLevel, volume);
      });

      vapi.on('call-start', () => {
        btnStart.style.display = 'none';
        btnStop.style.display = 'inline-flex';
        setStatus('Conectando...', true);
      });

      vapi.on('speech-start', () => {
        setStatus('🔊 Hablando...', true);
      });

      vapi.on('speech-end', () => {
        setStatus('🎤 Escuchando...', true);
      });

      vapi.on('call-end', () => {
        btnStart.style.display = 'inline-flex';
        btnStop.style.display = 'none';
        setStatus('Listo para hablar', false);
        stopVisualizer();
      });

      vapi.on('error', (e) => {
        console.error('Vapi error:', e);
        setStatus('Error de conexión', false);
      });

      btnStart.addEventListener('click', async () => {
        setStatus('Iniciando...', true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          startVisualizer(stream);
          await vapi.start(ASSISTANT_ID);
        } catch (err) {
          console.error(err);
          setStatus('Necesitas dar permiso al micrófono', false);
          stopVisualizer();
        }
      });

      btnStop.addEventListener('click', () => {
        vapi.stop();
      });
    }
  </script>

</body>
</html>
